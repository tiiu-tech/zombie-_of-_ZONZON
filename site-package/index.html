// the BGM panel is a "window" you can drag by its title bar, like a real popup
let bgmDragged = false;
(function initBgmDrag(){
  const panel = document.getElementById('bgmPanel');
  const head = document.getElementById('bgmHead');
  let dragging = false, startX, startY, startLeft, startTop;
  head.style.cursor = 'move';
  head.addEventListener('pointerdown', (e)=>{
    dragging = true; bgmDragged = false;
    const r = panel.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY; startLeft = r.left; startTop = r.top;
    panel.style.left = r.left + 'px';
    panel.style.top = r.top + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) bgmDragged = true;
    const maxLeft = window.innerWidth - panel.offsetWidth - 4;
    const maxTop = window.innerHeight - 40;
    panel.style.left = Math.max(4, Math.min(maxLeft, startLeft + dx)) + 'px';
    panel.style.top = Math.max(4, Math.min(maxTop, startTop + dy)) + 'px';
  });
  const endDrag = ()=>{ dragging = false; setTimeout(()=>{ bgmDragged = false; }, 50); };
  head.addEventListener('pointerup', endDrag);
  head.addEventListener('pointercancel', endDrag);
})();
// in-page BGM track — plays/pauses independently, ducks out while an
// episode is open so it never fights with the video's own audio

const bgmPlayBtn = document.getElementById('bgmPlayBtn');

bgmAudio.volume = bgmVolume.value / 100;

bgmVolume.addEventListener('input', ()=>{ bgmAudio.volume = bgmVolume.value / 100; });
document.getElementById('bgmTrackSelect').addEventListener('change', (e)=>{

/* ============================================================
   MOTION UPGRADE — hover spotlight, magnetic buttons,
   kinetic typography, ink-splatter bursts
   ============================================================ */

// the background glows a soft red wherever the cursor hovers a
// card/photo, like the scene is reacting to what you're looking at
const spotlightEl = document.getElementById('spotlight');
const SPOTLIGHT_TARGETS = '.cast-card, .card:not(.coming), .stage-photo, .history-row';
document.addEventListener('mousemove', (e)=>{
  if(e.target.closest(SPOTLIGHT_TARGETS)){
    spotlightEl.classList.add('show');
    spotlightEl.style.left = e.clientX+'px';
    spotlightEl.style.top = e.clientY+'px';
  } else {
    spotlightEl.classList.remove('show');
  }
});

// primary buttons gently pull toward the cursor, then spring back on leave
function initMagnetic(selector, strength){
  document.querySelectorAll(selector).forEach(btn=>{
    btn.classList.add('magnetic');
    let dx = 0, dy = 0, pressed = false;
    const apply = ()=>{ btn.style.transform = `translate(${dx}px, ${dy}px) scale(${pressed ? 0.92 : 1})`; };
    btn.addEventListener('mousemove', (e)=>{
      const r = btn.getBoundingClientRect();
      dx = (e.clientX - (r.left + r.width/2)) * strength;
      dy = (e.clientY - (r.top + r.height/2)) * strength;
      apply();
    });
    btn.addEventListener('mouseleave', ()=>{ dx = 0; dy = 0; pressed = false; btn.style.transform = ''; });
    // the same "shrink a little" press feedback other buttons get, layered
    // on top of the magnetic follow instead of fighting it
    btn.addEventListener('mousedown', ()=>{ pressed = true; apply(); });
    btn.addEventListener('mouseup', ()=>{ pressed = false; apply(); });
  });
}
initMagnetic('#tickerBtn, #langBtn, #spPlay, #closeBtn', 0.28);
initMagnetic('#heroPlay', 0.35);

// headline text drops in character-by-character with a springy overshoot,
// instead of just swapping instantly when you hover a different file
function kineticText(el, text){
  el.innerHTML = '';
  [...text].forEach((ch, i)=>{
    const span = document.createElement('span');
    span.className = 'kt-char';
    span.textContent = ch === ' ' ? ' ' : ch;
    span.style.transitionDelay = (i*16)+'ms';
    el.appendChild(span);
  });
  void el.offsetWidth;
  requestAnimationFrame(()=>{
    el.querySelectorAll('.kt-char').forEach(s=> s.classList.add('in'));
  });
}

// tapping a case-file evidence photo fires a camera flash, then lights it
// up big in a dark lightbox — like an investigator slapping it on a lightboard
function openEvidence(src){
  sfxClick();
  const flash = document.getElementById('evidenceFlash');
  flash.classList.remove('go');
  void flash.offsetWidth;
  flash.classList.add('go');
  document.getElementById('evidenceLightboxImg').src = src;
  document.getElementById('evidenceLightbox').classList.add('open');
}
document.getElementById('evidenceLightbox').addEventListener('click', ()=>{
  document.getElementById('evidenceLightbox').classList.remove('open');
});

// the giant background symbol cross-fades to match whichever episode
// is currently showing in the hero
// a little burst of ink flecks radiating from a point — used when a
// case file is opened, like a stamp hitting the page
function burstInk(x, y){
  for(let i=0; i<14; i++){
    const dot = document.createElement('div');
    dot.className = 'ink-dot';
    const ang = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*70;
    dot.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    dot.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    dot.style.left = x+'px'; dot.style.top = y+'px';
    const size = 3 + Math.random()*5;
    dot.style.width = size+'px'; dot.style.height = size+'px';
    dot.style.background = Math.random() > 0.5 ? 'var(--red)' : 'var(--ink)';
    document.body.appendChild(dot);
    dot.addEventListener('animationend', ()=> dot.remove());
  }
}

// custom neon-arrow cursor over tappable elements — idly wiggles like it's
// nudging you to click if you hover and stay still for a moment
document.body.classList.add('jscursor');
const CURSOR_SELECTOR = '.fx-link, .cast-card, .card:not(.coming), .history-row, details.how summary, .seek-track, .ctrl-btn, .scroll-close, .sp-speak, .sp-play, .bgm-head, .bgm-toggle, .bgm-link-row, .bgm-hotspot, .cast-evidence';
const customCursor = document.getElementById('customCursor');
const customCursorImg = document.getElementById('customCursorImg');
let cursorLastMoveAt = Date.now();
document.addEventListener('mousemove', (e)=>{
  cursorLastMoveAt = Date.now();
  customCursor.style.left = e.clientX + 'px';
  customCursor.style.top = e.clientY + 'px';
  customCursor.classList.toggle('show', !!e.target.closest(CURSOR_SELECTOR));
});
document.addEventListener('mouseleave', ()=> customCursor.classList.remove('show'));
setInterval(()=>{
  if(!customCursor.classList.contains('show')) return;
  if(Date.now() - cursorLastMoveAt > 900){
    customCursorImg.classList.remove('nudge');
    void customCursorImg.offsetWidth;
    customCursorImg.classList.add('nudge');
  }
}, 1500);

loadProgress();

/* ---------- motion polish: staggered fade-in on load/scroll, hero fade-in, language-switch cross-fade ---------- */
function revealHeroOnce(hero){
  if(heroRevealed) return;
  heroRevealed = true;
  hero.classList.add('reveal');
  requestAnimationFrame(()=> requestAnimationFrame(()=> hero.classList.add('in')));
}

(function setupSectionReveal(){
  const els = Array.from(document.querySelectorAll('.reveal'));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        io.unobserve(entry.target);
      }
    });
  }, { threshold:0.12 });
  els.forEach((el,i)=>{
    el.style.transitionDelay = Math.min(i*70, 300)+'ms';
    io.observe(el);
  });
})();


// deep link: opening a shared "#ep3" style URL jumps straight to that episode
(function checkDeepLink(){
  const m = location.hash.match(/^#ep(\d+)$/);
  if(!m) return;
  const idx = parseInt(m[1], 10) - 1;
  const ep = EPISODES[idx];
  if(!ep || ep.coming) return;
  const tryOpen = ()=>{ if(ytReady) openPlayer(ep); else setTimeout(tryOpen, 150); };
  setTimeout(tryOpen, 200);
})();
